name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs, useful for verifying a Dependabot PR on demand.
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      # `astro build` exits 0 even when every page fails to prerender, which is
      # how a fully blank site once reached production. `npm run build` chains
      # scripts/verify-build.mjs, which fails on empty or truncated output.
      - name: Build and verify output
        run: npm run build

      - name: Report audit status
        # Informational only: a transitive advisory upstream should surface here
        # without blocking an unrelated PR from merging.
        continue-on-error: true
        run: npm audit --audit-level=high
